name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Tests (rules, send gate, protocol)
        run: npm test
      - name: Helper checks on Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\helper.tests.ps1
      - name: Build extension file
        run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: outlook-classic-mcp
          path: dist/outlook-classic-mcp.mcpb
